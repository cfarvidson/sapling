services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sapling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-locally}
      POSTGRES_DB: ${POSTGRES_DB:-sapling}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sapling}']
      interval: 2s
      timeout: 5s
      retries: 10

  mcp-server:
    build:
      context: .
      dockerfile: packages/mcp-server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sapling}:${POSTGRES_PASSWORD:-changeme-locally}@postgres:5432/${POSTGRES_DB:-sapling}
      SAPLING_PORT: 3333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PAYLOADS: ${LOG_PAYLOADS:-false}
      MCP_TOKEN: ${MCP_TOKEN:-}
    ports:
      - '127.0.0.1:3333:3333'

  ntfy:
    image: binwiederhier/ntfy:latest
    command: serve
    restart: unless-stopped
    environment:
      TZ: UTC
      NTFY_BASE_URL: http://localhost:8080
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_BEHIND_PROXY: 'false'
      NTFY_LISTEN_HTTP: ':80'
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./data/ntfy/cache:/var/cache/ntfy
      - ./data/ntfy/lib:/var/lib/ntfy
